display_information:
  name: Hack Club Photos
  description: Batched Photos notifications and activity feed.
  background_color: "#1f1f2e"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Photos
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:join
      - channels:read
      - chat:write
      - chat:write.public
      - im:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://photos.hackclub.com/api/slack
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://photos.hackclub.com/api/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
